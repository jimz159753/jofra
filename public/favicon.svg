<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: rounded square, deep teal -->
  <rect width="32" height="32" rx="6" fill="#07191b"/>

  <!-- C arc centered at (13, 16), radius 8, gap opening right ~±52° -->
  <path d="M 17.9 9.7 A 8 8 0 1 0 17.9 22.3"
        fill="none" stroke="#c9a96e" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Sound / breath lines emerging from the C gap -->
  <line x1="20" y1="13.6" x2="24.5" y2="13.6"
        stroke="#c9a96e" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="20" y1="16" x2="27" y2="16"
        stroke="#c9a96e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="18.4" x2="24.5" y2="18.4"
        stroke="#c9a96e" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
</svg>
